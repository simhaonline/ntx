[package]
name = "ntx"
version = "1.0.0"
edition = "2024"
authors = ["Simha <simhaonline.in@gmail.com>"]
description = "Nityaksha AI Agent & Bot Control Plane CLI by Simha (Pure Rust)"

[[bin]]
name = "ntx"
path = "src/main.rs"

[lib]
name = "ntx"
path = "src/lib.rs"

[dependencies]
chrono = { version = "0.4.45", features = ["serde"] }
libc = "0.2.191"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.1"

[target.'cfg(target_os = "linux")'.dependencies]
nix = { version = "0.31.3", features = ["mount", "sched", "user", "signal", "process", "fs"] }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true
